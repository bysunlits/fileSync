worker_processes auto;

events {
    worker_connections 4096;
}

stream {
    server {
        listen 443 ssl;

        ssl_certificate     /etc/nginx/cert.pem;
        ssl_certificate_key /etc/nginx/key.pem;

        proxy_connect_timeout 5s;
        proxy_timeout 1h;

        proxy_pass unix:/run/myapp/upload.sock;
    }
}